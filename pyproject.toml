[project]
name = "digital-moose"
version = "0.1.0"
description = "A mention-only Telegram AI agent with a local control room"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "cryptography>=44", "python-multipart>=0.0.20", "markdown-it-py>=3,<5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "playwright>=1.50"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
